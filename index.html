<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục trang web với Div và CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-container">
        <!-- Header -->
        <header class="header">
            <h1>HEADER</h1>
        </header>

        <!-- Navigation Bar -->
        <nav class="navbar">
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Tin tức</a></li>
                <li><a href="#">Sản phẩm</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>

        <!-- Main Content (Sidebar + Main) -->
        <div class="main-content">
            <aside class="sidebar">
                <h3>SIDEBAR</h3>
                <p>Nội dung thanh bên</p>
            </aside>
            <main class="content">
                <h2>NỘI DUNG CHÍNH</h2>
                <p>Đây là khu vực hiển thị nội dung chính của trang web. Sử dụng CSS Grid/Flexbox giúp các thẻ div tự động điều chỉnh theo kích thước màn hình.</p>
            </main>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>FOOTER &copy; 2026 - Thiết kế trang web</p>
        </footer>
    </div>

</body>
</html>
